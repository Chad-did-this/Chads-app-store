name: iPhone IPA
on:
  push:
    branches: [main]
    paths: ['App Store/Apple/Store/**', 'distribution/ios_source.py', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-store-publishing
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd "App Store/Apple/Store" && xcodegen generate
      - name: Compile iPhone app without signing
        run: |
          xcodebuild -project "App Store/Apple/Store/ChadsStore.xcodeproj" -scheme ChadsStore -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="1.0.$GITHUB_RUN_NUMBER" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/ChadsStore.app" dist/Payload/
          cd dist && zip -qry chads-store.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-store
          path: dist/chads-store.ipa
      - name: Publish IPA and SideStore source
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[layout only]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-store-v1.0.$GITHUB_RUN_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; preserving original."
            mkdir -p published
            gh release download "$tag" --pattern chads-store.ipa --dir published
            cp published/chads-store.ipa dist/chads-store.ipa
          else
            gh release create "$tag" dist/chads-store.ipa --target "$GITHUB_SHA" --title "iPhone Store 1.0.$GITHUB_RUN_NUMBER" --notes "Unsigned IPA for compatible signing and sideloading. Not directly installable." --latest=false
          fi
          release_base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          python3 distribution/ios_source.py dist/chads-store.ipa "1.0.$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$release_base/$tag/chads-store.ipa" "$release_base/ios-source/source.json"
          if gh release view ios-source >/dev/null 2>&1; then
            gh release upload ios-source source.json icon.png --clobber
          else
            gh release create ios-source source.json icon.png --target "$GITHUB_SHA" --title "iPhone app source" --notes "Stable SideStore catalog URL." --latest=false
          fi
